name: "Reusable composer outdated check"

on:
    workflow_call:
        inputs:
            php-version:
              required: false
              default: "8.2"
              type: string
            branch:
              required: true
              type: string
            ignore-list:
              required: false
              type: string
              description: Ignore list type (e.g., public, private, lts)
            version-type:
              required: false
              default: "-M"
              type: string
              description: -M for major, -m for minor, -p for patch
            private-repo:
              required: false
              default: false
              type: boolean
            platform-repo:
              required: false
              default: false
              type: boolean
        # Declared so callers can pass only what they need instead of `secrets: inherit`.
        # All optional: callers that inherit satisfy them implicitly, and the two private-repo
        # secrets are only read when `private-repo: true`.
        # TEAMS_GITHUB_WORKFLOW_NOTIFICATIONS_WEBHOOK_URI is no longer read — the daily summary
        # in workflows-centralized (composer-checks-summary) posts instead, from the findings
        # artifact uploaded below (DevOps-Tasks#76). It stays declared because a caller that
        # passes a secret the workflow does not declare fails at startup
        # (data-quality-management-bundle passes it explicitly).
        secrets:
            TEAMS_GITHUB_WORKFLOW_NOTIFICATIONS_WEBHOOK_URI:
              required: false
            SSH_PRIVATE_KEY_PIMCORE_DEPLOYMENTS_USER:
              required: false
            COMPOSER_PIMCORE_REPO_PACKAGIST_TOKEN:
              required: false

permissions:
  contents: read

jobs:
    composer-checks:
        name: "Composer Checks"
        runs-on: "ubuntu-latest"
        env: 
          IGNORE_LIST_KEY: ${{ inputs.ignore-list }}
        steps:
            - name: "Checkout depdendent workflow code"
              id: checkout
              uses: "actions/checkout@v5.0.1"
              with:
                  ref: ${{ inputs.branch }}

            - name: "Checkout reusable workflow repository"
              uses: "actions/checkout@v5.0.1"
              with:
                  repository: "pimcore/workflows-collection-public"
                  path: ".workflows-collection-public"
                  ref: "main"

            - name: "Install PHP"
              uses: "shivammathur/setup-php@v2"
              with:
                  coverage: "none"
                  php-version: ${{ inputs.php-version }}

            - name: Install SSH Key # this is necessary for Composer to be able to clone source from pimcore/ee-pimcore
              if: ${{ inputs.private-repo == true }}
              uses: shimataro/ssh-key-action@v2.8.1
              with:
                key: ${{ secrets.SSH_PRIVATE_KEY_PIMCORE_DEPLOYMENTS_USER }}
                known_hosts: ".... we add this in the next step ;-)"

            - name: Install jq
              if: ${{ inputs.platform-repo == true }}
              run: sudo apt-get install jq
  
            - name: "Add authentication for private pimcore packages"
              if: ${{ inputs.private-repo == true }}
              run: |
                composer config repositories.private-packagist composer https://repo.pimcore.com/github-actions/
                composer config --global --auth http-basic.repo.pimcore.com github-actions ${{ secrets.COMPOSER_PIMCORE_REPO_PACKAGIST_TOKEN }}

            - name: Read and modify composer.json
              if: ${{ inputs.platform-repo == true }}
              id: update_composer
              run: |
                original_content=$(<composer.json)
                for conflict in $(echo "$original_content" | jq -r '.conflict | to_entries[] | @base64'); do
                  _jq() {
                    echo ${conflict} | base64 --decode | jq -r ${1}
                  }
                  package_name=$(_jq '.key')
                  composer require "$package_name:*" --no-update
                done

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Cache Composer dependencies
              uses: actions/cache@v5
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}

            - name: "Install dependencies with Composer"
              id: install
              uses: "ramsey/composer-install@v3"
              with:
                  dependency-versions: "highest"
                  composer-options: "--no-scripts"

            - name: "Parse ignore list from JSON"
              id: parse-ignore-list
              run: |
                if [[ -n "$IGNORE_LIST_KEY" ]]; then
                  IGNORE_PACKAGES=$(jq -r --arg key "$IGNORE_LIST_KEY" '.[$key] | join(",")' .workflows-collection-public/config/composer-ignore-list.json)
                  echo "IGNORE_PACKAGES=$IGNORE_PACKAGES" >> $GITHUB_ENV
                fi
                          
            - name: "Check for outdated dependencies"
              id: dependencies
              continue-on-error: true
              run: |
                VERSION_TYPE="${{ inputs.version-type }}"
                IGNORE_OPTIONS=""
                if [[ -n "$IGNORE_PACKAGES" ]]; then
                  IGNORE_OPTIONS=$(echo "$IGNORE_PACKAGES" | sed 's/,/ --ignore /g' | sed 's/^/--ignore /')
                fi
            
                OUTDATED=$(composer outdated -D $VERSION_TYPE $IGNORE_OPTIONS || true)
                if [[ -n "$OUTDATED" ]] && echo "$OUTDATED" | grep -E ' [!~] '; then
                    echo "Outdated dependencies found!" >> $GITHUB_STEP_SUMMARY
                    echo "$OUTDATED" | awk '{print "- " $0}' >> $GITHUB_STEP_SUMMARY
                    {
                      echo "OUTDATED_ENV<<EOF"
                      echo "$OUTDATED"
                      echo "EOF"
                    } >> $GITHUB_ENV
                    exit 1
                fi

            # Written on EVERY path, including a failed checkout or install: the daily
            # summary in workflows-centralized (composer-checks-summary) reads one of these
            # per leg and reports "clean", "findings" and "failed" alike. A Teams card
            # only on findings cannot distinguish "nothing found" from "never got that
            # far" (DevOps-Tasks#76). The `failed_step` names the first failed step so the
            # summary can say why without opening the run.
            - name: Write findings file for the daily summary
              if: always()
              id: findings
              env:
                CHECK: outdated
                BRANCH: ${{ inputs.branch }}
                PHP_VERSION: ${{ inputs.php-version }}
                IGNORE_LIST: ${{ inputs.ignore-list }}
                VERSION_TYPE: ${{ inputs.version-type }}
                JOB_STATUS: ${{ job.status }}
                OUTCOME_CHECKOUT: ${{ steps.checkout.outcome }}
                OUTCOME_INSTALL: ${{ steps.install.outcome }}
                OUTCOME_OUTDATED: ${{ steps.dependencies.outcome }}
                RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                set -euo pipefail
                STATUS=failed; FAILED_STEP=""
                # The outdated step is continue-on-error, so its "failure" IS the finding
                # and the job itself stays green.
                if [[ "$OUTCOME_OUTDATED" == "failure" ]]; then
                  STATUS=findings
                elif [[ "$JOB_STATUS" == "success" ]]; then
                  STATUS=clean
                else
                  for pair in "checkout=$OUTCOME_CHECKOUT" "install=$OUTCOME_INSTALL"; do
                    if [[ "${pair#*=}" == "failure" ]]; then FAILED_STEP="${pair%%=*}"; break; fi
                  done
                fi
                case "$VERSION_TYPE" in -M) SCOPE=major;; -m) SCOPE=minor;; -p) SCOPE=patch;; *) SCOPE="$VERSION_TYPE";; esac
                jq -n \
                  --arg check "$CHECK" --arg repository "$GITHUB_REPOSITORY" --arg branch "$BRANCH" \
                  --arg php "$PHP_VERSION" --arg ignore_list "$IGNORE_LIST" --arg scope "$SCOPE" \
                  --arg status "$STATUS" --arg failed_step "$FAILED_STEP" --arg summary "${OUTDATED_ENV:-}" \
                  --arg run_url "$RUN_URL" --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
                  '{schema: 1, check: $check, repository: $repository, branch: $branch, php: $php,
                    ignore_list: $ignore_list, scope: $scope, status: $status, failed_step: $failed_step,
                    summary: $summary, run_url: $run_url, run_id: ($run_id | tonumber),
                    run_attempt: ($run_attempt | tonumber), generated_at: (now | todate)}' \
                  > composer-findings.json
                cat composer-findings.json
                # Artifact names must be unique per run and may not contain / \ " : < > | * ?
                NAME=$(printf 'composer-findings-%s-%s-%s-php%s-%s' "$CHECK" "$SCOPE" "$BRANCH" "$PHP_VERSION" "${IGNORE_LIST:-none}" | tr -c 'A-Za-z0-9._-' '-')
                echo "name=$NAME" >> "$GITHUB_OUTPUT"

            - name: Upload findings file
              if: always()
              uses: actions/upload-artifact@v6
              with:
                name: ${{ steps.findings.outputs.name }}
                path: composer-findings.json
                retention-days: 7
                if-no-files-found: error
