name: "Reusable composer vulnerabilities check"

on:
    workflow_call:
        inputs:
            php-version:
              required: false
              default: "8.2"
              type: string
            branch:
              required: true
              type: string
            ignore-list:
              required: false
              type: string
              description: Ignore list type (e.g., public, private, lts)
            private-repo:
              required: false
              default: false
              type: boolean

permissions:
  contents: read

jobs:
    composer-checks:
        name: "Composer Checks"
        runs-on: "ubuntu-latest"
        outputs:
          has_vulnerabilities: ${{ steps.vulnerabilities.outputs.found }}
          vulnerabilities_text: ${{ steps.vulnerabilities.outputs.text }}
        env:
          IGNORE_LIST_KEY: ${{ inputs.ignore-list }}
        steps:
            - name: "Checkout depdendent workflow code"
              id: checkout
              uses: "actions/checkout@v5.0.1"
              with:
                  ref: ${{ inputs.branch }}

            - name: "Checkout reusable workflow repository"
              uses: "actions/checkout@v5.0.1"
              with:
                  repository: "pimcore/workflows-collection-public"
                  path: ".workflows-collection-public"
                  ref: "main"

            - name: "Install PHP"
              uses: "shivammathur/setup-php@v2"
              with:
                  coverage: "none"
                  php-version: ${{ inputs.php-version }}

            - name: Install SSH Key # this is necessary for Composer to be able to clone source from pimcore/ee-pimcore
              if: ${{ inputs.private-repo == true }}
              uses: shimataro/ssh-key-action@v2.8.0
              with:
                key: ${{ secrets.SSH_PRIVATE_KEY_PIMCORE_DEPLOYMENTS_USER }}
                known_hosts: ".... we add this in the next step ;-)"
    
            - name: "Add authentication for private pimcore packages"
              if: ${{ inputs.private-repo == true }}
              run: |
                composer config repositories.private-packagist composer https://repo.pimcore.com/github-actions/
                composer config --global --auth http-basic.repo.pimcore.com github-actions ${{ secrets.COMPOSER_PIMCORE_REPO_PACKAGIST_TOKEN }}

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Cache Composer dependencies
              uses: actions/cache@v5
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}

            - name: "Install dependencies with Composer"
              id: install
              uses: "ramsey/composer-install@v3"
              with:
                  dependency-versions: "highest"
                  composer-options: "--no-scripts"

            - name: "Check if composer.json has a config section and add CVEs to ignore list"
              id: update-composer-json
              run: |
                COMPOSER_FILE="composer.json"

                # Extract the CVE ignore list from vulnerabilities-ignore-list.json based on the key
                IGNORE_CVES=$(jq -r --arg key "$IGNORE_LIST_KEY" '.[$key]' .workflows-collection-public/config/vulnerabilities-ignore-list.json)

                # Check if IGNORE_CVES is a valid array, and then proceed
                if [[ -n "$IGNORE_CVES" && "$IGNORE_CVES" != "null" ]]; then
                  # Check if composer.json already has a config section
                  if jq -e '.config' composer.json > /dev/null; then
                    echo "Config section exists, updating it..."

                    # Check if the 'audit' section exists under 'config'
                    if jq -e '.config.audit' composer.json > /dev/null; then
                      echo "Audit section exists, appending CVEs to the ignore list..."
                      # Append the CVEs to the existing audit.ignore array
                      jq --argjson cves "$IGNORE_CVES" '.config.audit.ignore += $cves' composer.json > composer.json.tmp && mv composer.json.tmp composer.json
                    else
                      echo "Audit section does not exist, creating audit.ignore..."
                      # Create the audit section with the ignore array
                      jq --argjson cves "$IGNORE_CVES" '.config.audit.ignore = $cves' composer.json > composer.json.tmp && mv composer.json.tmp composer.json
                    fi
                  else
                    echo "Config section does not exist, creating config.audit.ignore..."
                    # Add the config and audit sections with the ignore array
                    jq --argjson cves "$IGNORE_CVES" '.config.audit.ignore = $cves' composer.json > composer.json.tmp && mv composer.json.tmp composer.json
                  fi
                fi

                # Print the updated composer.json
                cat $COMPOSER_FILE

            - name: "Check for security vulnerabilities"
              id: vulnerabilities
              run: |
                set +e
                # Abandoned packages are still listed in the output, but no longer influence the
                # exit code - otherwise they get reported as security vulnerabilities.
                VULNERABILITIES=$(composer audit --abandoned=report)
                EXIT_CODE=$?
                set -e

                echo "Raw composer audit output:"
                echo "$VULNERABILITIES"

                # Kept for the findings file below, whatever the exit code.
                {
                  echo "AUDIT_ENV<<EOF"
                  echo "$VULNERABILITIES"
                  echo "EOF"
                } >> $GITHUB_ENV

                if [ "$EXIT_CODE" -ne 0 ]; then
                    echo "Security vulnerabilities found!" >> $GITHUB_STEP_SUMMARY
                    echo "$VULNERABILITIES" | awk '{print "- " $0}' >> $GITHUB_STEP_SUMMARY

                    echo "found=true" >> $GITHUB_OUTPUT
                    {
                      echo "text<<EOF"
                      echo "Please check the following link for details:"
                      echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                      echo ""
                      echo "**Vulnerabilities found:**"
                      echo '```'
                      echo "$VULNERABILITIES"
                      echo '```'
                      echo ""
                      echo "If the list is too long, please refer to the link above."
                      echo "EOF"
                    } >> $GITHUB_OUTPUT
                fi

            # Written on EVERY path, including a failed checkout or install: the daily
            # summary in workflows-centralized (composer-checks-summary) reads one of these
            # per leg and reports "clean", "findings" and "failed" alike. A Teams card
            # only on findings cannot distinguish "nothing found" from "never got that
            # far" (DevOps-Tasks#76). The `failed_step` names the first failed step so the
            # summary can say why without opening the run.
            - name: Write findings file for the daily summary
              if: always()
              id: findings
              env:
                CHECK: vulnerabilities
                BRANCH: ${{ inputs.branch }}
                PHP_VERSION: ${{ inputs.php-version }}
                IGNORE_LIST: ${{ inputs.ignore-list }}
                JOB_STATUS: ${{ job.status }}
                FOUND: ${{ steps.vulnerabilities.outputs.found }}
                OUTCOME_CHECKOUT: ${{ steps.checkout.outcome }}
                OUTCOME_INSTALL: ${{ steps.install.outcome }}
                OUTCOME_AUDIT: ${{ steps.vulnerabilities.outcome }}
                RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                set -euo pipefail
                STATUS=failed; FAILED_STEP=""
                if [[ "$FOUND" == "true" ]]; then
                  STATUS=findings
                elif [[ "$JOB_STATUS" == "success" ]]; then
                  STATUS=clean
                else
                  for pair in "checkout=$OUTCOME_CHECKOUT" "install=$OUTCOME_INSTALL" "audit=$OUTCOME_AUDIT"; do
                    if [[ "${pair#*=}" == "failure" ]]; then FAILED_STEP="${pair%%=*}"; break; fi
                  done
                fi
                jq -n \
                  --arg check "$CHECK" --arg repository "$GITHUB_REPOSITORY" --arg branch "$BRANCH" \
                  --arg php "$PHP_VERSION" --arg ignore_list "$IGNORE_LIST" --arg status "$STATUS" \
                  --arg failed_step "$FAILED_STEP" --arg summary "${AUDIT_ENV:-}" \
                  --arg run_url "$RUN_URL" --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
                  '{schema: 1, check: $check, repository: $repository, branch: $branch, php: $php,
                    ignore_list: $ignore_list, status: $status, failed_step: $failed_step,
                    summary: $summary, run_url: $run_url, run_id: ($run_id | tonumber),
                    run_attempt: ($run_attempt | tonumber), generated_at: (now | todate)}' \
                  > composer-findings.json
                cat composer-findings.json
                # Artifact names must be unique per run and may not contain / \ " : < > | * ?
                NAME=$(printf 'composer-findings-%s-%s-php%s-%s' "$CHECK" "$BRANCH" "$PHP_VERSION" "${IGNORE_LIST:-none}" | tr -c 'A-Za-z0-9._-' '-')
                echo "name=$NAME" >> "$GITHUB_OUTPUT"

            - name: Upload findings file
              if: always()
              uses: actions/upload-artifact@v6
              with:
                name: ${{ steps.findings.outputs.name }}
                path: composer-findings.json
                retention-days: 7
                if-no-files-found: error

    notify:
        needs: composer-checks
        if: ${{ needs.composer-checks.outputs.has_vulnerabilities == 'true' }}
        uses: pimcore/workflows-collection-public/.github/workflows/reusable-teams-notify.yaml@main
        with:
          title: "${{ github.repository }}@${{ inputs.branch }} vulnerabilities report"
          text: ${{ needs.composer-checks.outputs.vulnerabilities_text }}
        secrets: inherit
