name: "Translations Sync"

# Keeps a bundle's studio.{locale}.yaml files in sync with studio.en.yaml on PRs.
# Deterministic scripts (from pimcore/claude-code) decide IF work is needed and
# whether generated output is acceptable; a tool-restricted Claude step translates.
# Issue: pimcore/product-management#1316

on:
  workflow_call:
    inputs:
      translations_dir:
        description: "Translations directory relative to the repo root (e.g. translations or src/Resources/translations). Must not contain spaces or commas."
        required: true
        type: string
      claude_code_ref:
        description: "Ref of pimcore/claude-code to check out (translation skill + scripts)"
        required: false
        type: string
        default: "main"
      model:
        description: "Model passed to claude-code-action. Pass an empty string to fall back to the action's own default."
        required: false
        type: string
        default: "claude-sonnet-5"
    secrets:
      TRANSLATIONS_GITHUB_TOKEN:
        description: "Bot PAT: contents:write on the calling repo, read on pimcore/claude-code, pull-requests:write"
        required: true
      ANTHROPIC_TRANSLATIONS_API_KEY:
        required: true

jobs:
  translations:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # pushes and comments use the PAT, never GITHUB_TOKEN
    env:
      SKILL_PATH: .claude-code/plugins/pimcore-studio/skills/pimcore-studio-ui-i18n-translation-workflow
    steps:
      # Fork PRs get no secrets, and even validation needs the private
      # pimcore/claude-code checkout -> skip green with an explanatory summary.
      # (secrets context is not available in `if:` -> compare head repo instead.)
      - name: Gate — same-repo PRs only
        id: gate
        shell: bash
        env:
          DIR: ${{ inputs.translations_dir }}
          MODEL: ${{ inputs.model }}
        run: |
          # Inputs are interpolated into shell/CLI strings downstream — reject anything
          # that is not a plain path / model identifier before it gets there.
          if ! [[ "$DIR" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::translations_dir contains unsupported characters"; exit 1
          fi
          if [[ "$DIR" = /* ]] || [[ "$DIR" =~ (^|/)\.\.(/|$) ]]; then
            echo "::error::translations_dir must be a relative path inside the repository"; exit 1
          fi
          if [ -n "$MODEL" ] && ! [[ "$MODEL" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::model contains unsupported characters"; exit 1
          fi

          if [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Translations sync skipped"
              echo ""
              echo "Automated translation sync is unavailable for fork PRs (it requires org secrets)."
              echo "A maintainer must verify translations before/after merge."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout PR head
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v5.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.TRANSLATIONS_GITHUB_TOKEN }}
          persist-credentials: false # the PAT never lands in .git/config; push creds are injected after the Claude step

      - name: Clear private checkout path
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          # A PR that commits .claude-code (as a symlink or a directory) would make
          # the next checkout materialize the private repo somewhere else — and the
          # later `rm -rf .claude-code` would then remove only the link, leaving
          # private content on disk while the model runs. Clear the path first.
          if [ -e .claude-code ] || [ -L .claude-code ]; then
            echo "::warning::removing a pre-existing .claude-code path committed by this branch"
            rm -rf .claude-code
          fi

      - name: Checkout pimcore/claude-code (skill + scripts)
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v5.0.1
        with:
          repository: pimcore/claude-code
          ref: ${{ inputs.claude_code_ref }}
          token: ${{ secrets.TRANSLATIONS_GITHUB_TOKEN }}
          path: .claude-code
          persist-credentials: false # nothing pushes here; keeps the PAT out of this checkout's git config

      - name: Setup Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        if: steps.gate.outputs.run == 'true'
        run: pip install pyyaml==6.0.2

      - name: Scan translations (key delta + validation)
        id: scan
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          DIR: ${{ inputs.translations_dir }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          DIR="${DIR%/}"

          # The lexical input checks cannot see filesystem tricks: a PR could commit the
          # translations dir or a studio.*.yaml as a symlink, making the scanners below
          # read arbitrary paths (the private pimcore/claude-code checkout is still on
          # disk at this point). Resolve and reject before anything opens a file.
          if [ "$(realpath -e "$DIR" 2>/dev/null)" != "$GITHUB_WORKSPACE/$DIR" ]; then
            echo "::error::translations_dir does not resolve to a real directory inside the workspace (missing, symlinked, or escaping)"
            exit 1
          fi
          SYMLINKS=$(find "$DIR" -type l)
          if [ -n "$SYMLINKS" ]; then
            echo "::error::symlinks are not allowed inside the translations directory:"
            echo "$SYMLINKS"
            exit 1
          fi

          # Delta vs the merge base, not the base tip: English changes that landed on the
          # base branch after this PR forked are not this PR's work and must stay out.
          MERGE_BASE=$(git merge-base "origin/$BASE_REF" HEAD)
          echo "Merge base with origin/$BASE_REF: $MERGE_BASE"
          # Later steps recompute staleness against the same comparison point.
          echo "merge_base=$MERGE_BASE" >> "$GITHUB_OUTPUT"

          # Baseline: how many validation errors did the translation files already carry at
          # the merge base? The job's pass/fail rule is "no worse than the baseline", never
          # "zero errors" — a repo with legacy drift must still be able to merge a clean PR.
          # Materialized with `git show`, which emits blob content, so it cannot traverse a
          # symlink the way a worktree or a second checkout could. A bundle with no
          # translation files at the merge base (brand new) correctly yields a baseline of 0.
          BASE_DIR="$RUNNER_TEMP/base/$DIR"
          mkdir -p "$BASE_DIR"
          BASELINE_ERRORS=0
          # Always exists, even when the block below is skipped (brand-new bundle, no
          # baseline files) — the install step copies this into .translation-scan/
          # unconditionally, so a missing file here would fail that cp.
          : > "$RUNNER_TEMP/baseline.txt"
          BASE_FILES=$(git ls-tree --name-only "$MERGE_BASE" -- "$DIR/" | grep -E '/studio\.[^/]+\.yaml$' || true)
          if [ -n "$BASE_FILES" ]; then
            while IFS= read -r f; do
              git show "$MERGE_BASE:$f" > "$BASE_DIR/$(basename "$f")"
            done <<< "$BASE_FILES"
            set +e
            python3 "$SKILL_PATH/scripts/validate_translations.py" --dir "$BASE_DIR" \
              > "$RUNNER_TEMP/baseline.txt" 2>&1
            set -e
            # Summary line: "6 language(s) checked: 151 error(s), 0 warning(s), 1811 untranslated".
            # Take the LAST match so per-language lines can never be picked up, and fall back
            # to 0 rather than an empty string (which would break the comparisons below).
            BASELINE_ERRORS=$(grep -oE '[0-9]+ error\(s\)' "$RUNNER_TEMP/baseline.txt" | tail -1 | grep -oE '^[0-9]+' || echo 0)
          fi
          echo "baseline_errors=$BASELINE_ERRORS" >> "$GITHUB_OUTPUT"
          echo "Baseline (merge base) validation errors: $BASELINE_ERRORS"

          python3 "$SKILL_PATH/scripts/key_diff.py" \
            --path "$DIR/studio.en.yaml" \
            --base-ref "$MERGE_BASE" > "$RUNNER_TEMP/delta.json"

          # Precompute what the skill's steps 3 and 4 would otherwise have the model do turn
          # by turn: the source lines that use each new key (tone: button / label / tooltip),
          # and reviewed classic-admin translations for each new English value. Both are
          # deterministic, so they are handed to the model as inputs — see SKILL.md "CI mode".
          # key_context.py skips node_modules, vendor, build output and dot-directories (which
          # includes the private checkout).
          python3 "$SKILL_PATH/scripts/key_context.py" --delta "$RUNNER_TEMP/delta.json" --src . \
            --out "$RUNNER_TEMP/context.json"
          python3 "$SKILL_PATH/scripts/harvest_lookup.py" --delta "$RUNNER_TEMP/delta.json" --dir "$DIR" \
            --out "$RUNNER_TEMP/harvest.json"

          set +e
          python3 "$SKILL_PATH/scripts/validate_translations.py" --dir "$DIR" \
            > "$RUNNER_TEMP/validation.txt" 2>&1
          VALIDATE_EXIT=$?
          set -e
          cat "$RUNNER_TEMP/validation.txt"
          if [ "$VALIDATE_EXIT" -ge 2 ]; then
            echo "::error::validate_translations.py failed with a usage/IO error (exit $VALIDATE_EXIT) — check translations_dir"
            exit 1
          fi

          # Same parse as the baseline, against the PR's current state. Exit 1 (errors exist)
          # is no longer a gate on its own — only the comparison with the baseline is.
          CURRENT_ERRORS=$(grep -oE '[0-9]+ error\(s\)' "$RUNNER_TEMP/validation.txt" | tail -1 | grep -oE '^[0-9]+' || echo 0)
          echo "current_errors=$CURRENT_ERRORS" >> "$GITHUB_OUTPUT"
          echo "Current validation errors: $CURRENT_ERRORS (merge base baseline: $BASELINE_ERRORS)"

          # A changed English key is "stale" for a language while that language's value is
          # still exactly the value it had at the merge base. The bot's own commit rewrites
          # those values, so the run that commit triggers finds nothing stale and no-ops —
          # that, plus validation owning added/removed keys, is the termination argument.
          # Written to a file rather than piped as a heredoc so the "Detect changes" step
          # can re-run the identical check after the model has edited the files. RUNNER_TEMP
          # persists across steps within the job and is outside the workspace, so the model
          # (workspace-scoped write rules, Bash limited to the two skill scripts) cannot
          # touch this script.
          cat > "$RUNNER_TEMP/stale_check.py" <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          import yaml

          dir_path = Path(os.environ["DIR"])
          merge_base = os.environ["MERGE_BASE"]
          temp = Path(os.environ["RUNNER_TEMP"])
          stale_out = Path(os.environ["STALE_OUT"])

          delta = json.loads((temp / "delta.json").read_text(encoding="utf-8"))
          changed = delta.get("changed") or {}
          candidates = list(changed.keys()) if isinstance(changed, dict) else list(changed)

          MISSING = object()


          def load(text):
              """Parse translation YAML; missing, empty, or malformed files are empty mappings.

              Malformed files are validation's problem (exit 1 routes to the repair arm);
              staleness must not crash before that arm can run.
              """
              if not text:
                  return {}
              try:
                  return yaml.safe_load(text) or {}
              except yaml.YAMLError:
                  return {}


          def lookup(doc, key):
              """Resolve a key stored either flat ("a.b: x") or nested (a: {b: x})."""
              if isinstance(doc, dict) and key in doc:
                  return doc[key]
              node = doc
              for part in key.split("."):
                  if not isinstance(node, dict) or part not in node:
                      return MISSING
                  node = node[part]
              return node


          def at_merge_base(rel_path):
              shown = subprocess.run(
                  ["git", "show", f"{merge_base}:{rel_path}"],
                  capture_output=True,
                  text=True,
                  check=False,
              )
              return load(shown.stdout) if shown.returncode == 0 else {}


          stale = {}
          for path in sorted(dir_path.glob("studio.*.yaml")):
              if path.name == "studio.en.yaml":
                  continue
              lang = path.name[len("studio."):-len(".yaml")]
              now = load(path.read_text(encoding="utf-8")) if path.is_file() else {}
              before = at_merge_base(Path(os.path.normpath(path)).as_posix())
              for key in candidates:
                  new_value = lookup(now, key)
                  old_value = lookup(before, key)
                  # Missing on either side counts as "differs": validation owns missing keys.
                  if new_value is MISSING or old_value is MISSING:
                      continue
                  if new_value == old_value:
                      stale.setdefault(key, []).append(lang)

          payload = {key: stale[key] for key in sorted(stale)}
          stale_out.write_text(
              json.dumps(payload, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          print(f"Stale changed keys: {len(payload)}")
          PY

          MERGE_BASE="$MERGE_BASE" STALE_OUT="$RUNNER_TEMP/stale.json" \
            python3 "$RUNNER_TEMP/stale_check.py"

          cat "$RUNNER_TEMP/stale.json"

          # delta_check.py — the per-key, per-language "is this PR's delta applied?" check —
          # ships with the skill (versioned and unit-tested in pimcore/claude-code). It is run
          # twice: here, to decide whether the model has any delta work left at all, and after
          # the translate step, to judge the model's output. Copied into RUNNER_TEMP — outside
          # the workspace — for the same reason stale_check.py lives there: the model
          # (workspace-scoped write rules, Bash limited to one exact command) cannot edit the
          # check that judges it.
          if [ ! -f "$SKILL_PATH/scripts/delta_check.py" ]; then
            echo "::error::$SKILL_PATH/scripts/delta_check.py not found — the pimcore/claude-code ref checked out (claude_code_ref) predates the script"
            exit 1
          fi
          cp "$SKILL_PATH/scripts/delta_check.py" "$RUNNER_TEMP/delta_check.py"

          STALE_EMPTY=$(jq -r 'if . == {} then "true" else "false" end' "$RUNNER_TEMP/stale.json")

          # Is the PR's own delta already applied? delta.json is computed against the merge
          # base, so once a PR adds a key it stays non-empty for the PR's whole life — also
          # after the bot has translated that key. Deciding on the raw delta made every later
          # human push (a code fix, a rebase, an "Automatic frontend build" commit) pay a full
          # model run that ended in "Nothing to commit". delta_check.py asks the question that
          # actually matters: are any added keys still missing, or removed keys still present,
          # in any configured language? Any non-zero exit (violations, or a crash) counts as
          # "work remaining", so a broken check fails towards running the model, not away.
          set +e
          python3 "$RUNNER_TEMP/delta_check.py" --delta "$RUNNER_TEMP/delta.json" --dir "$DIR" \
            --languages "$SKILL_PATH/data/languages.yaml" > "$RUNNER_TEMP/delta-remaining.txt" 2>&1
          DELTA_CHECK_EXIT=$?
          set -e
          cat "$RUNNER_TEMP/delta-remaining.txt"
          DELTA_DONE=false
          if [ "$DELTA_CHECK_EXIT" -eq 0 ]; then
            DELTA_DONE=true
          fi

          # Circuit breaker: the workflow's own commit never re-enters the translate arm —
          # at most one bot commit per human push, even if the model's output is unstable.
          BOT_HEAD=false
          if [ "$(git log -1 --format=%s)" = "Sync translations with studio.en.yaml [automated]" ]; then
            BOT_HEAD=true
          fi

          # The model runs when THIS PR left work behind: added/removed keys not yet applied
          # in every language, changed keys whose translations are still the pre-change ones,
          # or validation errors this PR introduced (current > merge-base baseline). It does
          # NOT run for the pre-existing backlog: those errors sit on both sides of the
          # baseline comparison, the model is not allowed to touch studio.en.yaml (where such
          # drift often originates), and a backlog it cannot clear would otherwise invoke it
          # on every push of every PR forever. Legacy drift is a deliberate human task, not a
          # per-PR tax. Pass/fail is unchanged: the baseline comparison in the gates below.
          if { [ "$DELTA_DONE" = "false" ] || [ "$STALE_EMPTY" = "false" ] || [ "$CURRENT_ERRORS" -gt "$BASELINE_ERRORS" ]; } && [ "$BOT_HEAD" = "false" ]; then
            echo "needs_translation=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_translation=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary — in sync
        if: steps.gate.outputs.run == 'true' && steps.scan.outputs.needs_translation == 'false'
        shell: bash
        env:
          CURRENT_ERRORS: ${{ steps.scan.outputs.current_errors }}
        run: |
          # "In sync" is only true at zero errors. With errors outstanding this run still did
          # nothing on purpose: they pre-date the PR (current == baseline), so the model is not
          # invoked for them — see the trigger in the scan step.
          if [ "$CURRENT_ERRORS" -eq 0 ]; then
            {
              echo "### ✅ Translations in sync"
              echo ""
              echo "Every key in studio.en.yaml is present and valid in all target languages."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ✅ No translation work left for this PR"
              echo ""
              echo "This PR's own key changes are applied in every target language (or it has"
              echo "none), and it introduced no validation errors. ${CURRENT_ERRORS} pre-existing"
              echo "validation error(s) remain in the translation files; they are not blocking"
              echo "this PR and are not repaired by PR runs — fix them in a dedicated PR."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The model did not run, so the workflow has nothing to regenerate — but the PR must
      # still not leave validation worse than it found it. Pre-existing errors sit in both
      # numbers and cancel out; only errors this PR introduced can make the difference grow.
      - name: Guard — no new validation errors
        if: steps.gate.outputs.run == 'true' && steps.scan.outputs.needs_translation == 'false'
        shell: bash
        env:
          BASELINE_ERRORS: ${{ steps.scan.outputs.baseline_errors }}
          CURRENT_ERRORS: ${{ steps.scan.outputs.current_errors }}
        run: |
          if [ "$CURRENT_ERRORS" -gt "$BASELINE_ERRORS" ]; then
            {
              echo "### ❌ This PR adds validation errors to the translation files"
              echo ""
              echo "Validation errors went from ${BASELINE_ERRORS} at the merge base to ${CURRENT_ERRORS}."
              echo "This PR does not change studio.en.yaml, so the workflow has no key delta to"
              echo "regenerate the language files from — fix them in this PR."
              echo ""
              echo '```'
              cat "$RUNNER_TEMP/validation.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::This PR introduces $((CURRENT_ERRORS - BASELINE_ERRORS)) new translation validation error(s) (merge base: $BASELINE_ERRORS, now: $CURRENT_ERRORS)"
            exit 1
          fi

      # ── Auto-translate arm ────────────────────────────────────────────────
      # Claude only edits translation files; everything before and after it is
      # deterministic. Nothing is committed unless re-validation passes.

      - name: Install translation skill into workspace
        if: steps.gate.outputs.run == 'true' && steps.scan.outputs.needs_translation == 'true'
        run: |
          # claude-code-action restores .claude/ from the base branch before the CLI
          # starts (defense against PR-injected config), so anything we put there is
          # wiped. Install the skill at a neutral workspace path instead.
          rm -rf .translation-skill
          cp -r "$SKILL_PATH" .translation-skill
          # The private checkout must not be on disk while the model runs; the skill
          # copy above is the only piece it needs.
          rm -rf .claude-code
          # Pre-create the ambiguity report empty: the model only ever appends to it, so
          # no create-permission semantics are involved. Remove any pre-existing path first
          # (file, directory, or symlink): a bare `: >` follows a symlink instead of replacing
          # it, so a PR-committed symlink here could redirect the write; rm -rf removes
          # whatever is there without ever following it, so what gets created next is always
          # a fresh regular file this workflow wrote.
          rm -rf .translation-report.md
          : > .translation-report.md

          # Scan artifacts must live in the workspace: RUNNER_TEMP is outside it, and
          # read-only tools are auto-approved only inside the working directory.
          # .translation-scan/ is outside translations_dir and outside the commit
          # file_pattern, so it is never committed. Remove any pre-existing path first (file,
          # directory, or symlink): mkdir -p succeeds silently on a directory symlink and the
          # cp below would then write through it; rm -rf removes whatever is there without
          # ever following it, so the directory created next is always a fresh regular one
          # this workflow made.
          rm -rf .translation-scan
          mkdir -p .translation-scan
          cp "$RUNNER_TEMP/delta.json" "$RUNNER_TEMP/stale.json" "$RUNNER_TEMP/context.json" "$RUNNER_TEMP/harvest.json" \
             "$RUNNER_TEMP/validation.txt" "$RUNNER_TEMP/baseline.txt" .translation-scan/

          # claude-code-action snapshots the PR's versions of its sensitive config
          # paths into .claude-pr/ with dereference:true before replacing them from
          # the base branch. That snapshot follows symlinks — at those paths or
          # nested inside them — and lands inside the workspace, where the model can
          # read it. The action replaces all of these from base anyway, so removing
          # the PR's copies here costs nothing and closes the dereference entirely.
          for p in .claude .mcp.json .claude.json .gitmodules .ripgreprc CLAUDE.md CLAUDE.local.md .husky; do
            if [ -e "$p" ] || [ -L "$p" ]; then
              echo "::warning::removing PR-authored $p before invoking the model (replaced from the base branch anyway)"
              rm -rf "$p"
            fi
          done

      - name: Translate missing keys (Claude, tool-restricted)
        id: translate
        if: steps.gate.outputs.run == 'true' && steps.scan.outputs.needs_translation == 'true'
        # The deterministic gates below (English-base guard, re-validate, delta check) are
        # the authority on whether the model's output is acceptable, so a model failure —
        # including running out of turns — must fall through to them instead of skipping
        # them. continue-on-error lets a turn-limit stop (or any other step failure here)
        # reach those gates, which then fail the job with a far better diagnosis than
        # "reached maximum number of turns" if the model produced nothing usable.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_TRANSLATIONS_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            Non-interactive CI run. Read .translation-skill/SKILL.md first and follow
            its workflow to bring the translation files in
            "${{ inputs.translations_dir }}" in sync with studio.en.yaml. Its
            scripts/, data/, and references/ directories sit alongside it, at
            .translation-skill/scripts/, .translation-skill/data/, and
            .translation-skill/references/.

            The deterministic scan already ran:
            - Key delta (added/changed/removed): read .translation-scan/delta.json
            - Stale changed keys: read .translation-scan/stale.json — a
              {"key": ["lang", ...]} map of the changed-key/language pairs whose
              translation is still the pre-change one. These are the ONLY `changed`
              entries to re-translate, and only into the languages listed for them;
              changed keys absent from stale.json are already up to date.
            - Validation report: read .translation-scan/validation.txt
            - Usage context per key: read .translation-scan/context.json — the source lines
              that use each added/changed key (button vs label vs tooltip decides tone and
              length). This is the skill's "read the code first" step, already done: do NOT
              grep the source for keys.
            - Reviewed classic-admin translations: read .translation-scan/harvest.json — for
              every key listed there, use the given per-language values verbatim. This is
              the skill's "reuse admin translations" step, already done: do NOT open
              data/admin-harvest.csv or the bundle's admin.*.yaml files.

            Do not run key_diff.py, key_context.py or harvest_lookup.py. The skill's workflow
            tells you to do those steps, but in this CI run they are already done — their
            results are the files above — and Bash has no permission to run anything except
            the validation command below.

            Fix as much as you can, in this priority order:

            1. FIRST, this PR's own delta. Translate the added keys into every target
               language per the skill's guidelines and glossary, re-translate the stale
               changed-key / language pairs listed in stale.json, and remove the removed
               keys from all language files. Insert each key at the same position it has
               in studio.en.yaml. This part is mandatory — the job fails if it is not
               completed.
            2. THEN, fix any validation error in .translation-scan/validation.txt that this
               PR introduced — i.e. one that is NOT also listed in
               .translation-scan/baseline.txt (the errors that already existed at the merge
               base): missing keys, extra keys that are not in English, non-string values
               that need quoting, key order, placeholder mismatches, and plural pairs.
            3. Leave the errors listed in .translation-scan/baseline.txt alone. They are
               legacy drift that predates this PR, are not blocking it, and are cleaned up
               in dedicated PRs — not here. Spending turns on them is the difference between
               finishing step 1 inside the turn budget and running out.
            4. Missing keys are usually clustered: a feature's keys typically sit together
               in studio.en.yaml (for example operational-grid.csv-import.title/description/
               ok/cancel are four adjacent keys). Insert a whole run of adjacent missing
               keys in ONE edit rather than one edit per key — that is the difference
               between finishing inside the turn budget and running out of turns. Each
               tool call costs one turn and the budget is finite, so prefer the fewest
               edits that do the job correctly. Do NOT rewrite an entire language file to
               fix a handful of keys: restating thousands of already-correct lines is slow
               and expensive, and risks corrupting translations that were fine. Never alter
               a value that is already correct — only add, remove, or reorder what the
               reported errors require.
            5. Values that are identical to their English source are reported as
               "untranslated". Those are WARNINGS, not errors — for technical terms an
               identical value is legitimate. Do not mass-rewrite them: leave them alone
               unless the key is part of this PR's delta.

            Rules for this CI run:
            - Edit ONLY studio.{locale}.yaml language files in
              "${{ inputs.translations_dir }}". Never touch studio.en.yaml.
            - Do not run git commands; do not create commits, branches, or PRs.
            - There is no user to ask: for ambiguous keys apply the skill's guideline
              default. The file .translation-report.md in the repo root already exists
              and is empty: if there were ambiguous keys, append a short markdown section
              listing them (key, chosen reading, alternative) to it. If there were none,
              leave it empty.
            - Before finishing, re-run validation and confirm two things: (a) none of the
              delta keys you were assigned in step 1 appear as errors, and (b) the total
              error count has not increased. Anything you cleared beyond that is a bonus;
              the total does not have to reach zero. Use exactly this command,
              byte for byte:
              python3 .translation-skill/scripts/validate_translations.py --dir ${{ inputs.translations_dir }}
              Any other variant is denied — do not add quotes, extra flags, redirects, or
              pipes, and do not chain it with other commands.
          # The single Bash allow rule below is an exact match, so the command spelled out
          # in the prompt above must stay byte-identical to it. Keep translations_dir
          # unquoted in both (the gate step rejects values containing spaces).
          #
          # `Write` is listed bare, with no path: the SDK allowlist gates file tools by NAME,
          # and the file-permission checks match only Edit(path)/Read(path) rules ("Edit rules
          # apply to all built-in tools that edit files"), so the two Edit allows below are
          # what scope where Write may write, and the Edit denies below still block it.
          # Omitting Write entirely is what produced 16 permission denials on the first run.
          #
          # Edit(.translation-skill/**) and Edit(.translation-scan/**) exist because of that
          # bare Write: the docs do not settle whether a bare allow matches a path covered by
          # no Edit rule at all, so these two paths are denied explicitly rather than left to
          # fall through. Deny beats allow unconditionally and Edit rules cover every
          # file-editing tool, so the mechanical gate's own validator (.translation-skill/)
          # and the scan artifacts that define the model's task (.translation-scan/) are
          # unwritable under either reading. Neither is Read-denied — the model must read the
          # skill and its precomputed delta/stale/validation inputs.
          #
          # --max-turns is sized for the delta of one PR (measured: ~40–50 turns for an
          # 18-key delta across 6 languages on Sonnet). It was 150 while PR runs also repaired
          # the pre-existing backlog; that is no longer triggered per PR (see the scan step).
          # Exhausting the budget on an unusually large delta fails the delta gate below
          # loudly and the next push retries — it does not go green with keys missing.
          claude_args: |
            --max-turns 50
            ${{ inputs.model != '' && format('--model {0}', inputs.model) || '' }}
            --allowedTools "Read,Glob,Grep,TodoWrite,Write,Edit(${{ inputs.translations_dir }}/studio.*.yaml),Edit(.translation-report.md),Bash(python3 .translation-skill/scripts/validate_translations.py --dir ${{ inputs.translations_dir }})"
            --disallowedTools "Edit(${{ inputs.translations_dir }}/studio.en.yaml),Read(.git/**),Read(.claude-code/**),Read(.translation-skill/data/admin-harvest.csv),Edit(.git/**),Edit(.translation-skill/**),Edit(.translation-scan/**)"

      - name: Note model outcome
        if: steps.gate.outputs.run == 'true' && steps.scan.outputs.needs_translation == 'true'
        env:
          OUTCOME: ${{ steps.translate.outcome }}
        run: |
          if [ "$OUTCOME" != "success" ]; then
            echo "::warning::The translate step did not complete (outcome: ${OUTCOME}). Any work it did complete is still being validated by the gates below."
            {
              echo "### ⚠️ Model step did not complete (outcome: ${OUTCOME})"
              echo ""
              echo "Any work it did complete is still being validated by the gates below;"
              echo "the delta gate fails the job if this PR's keys did not all land."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Guard — English base untouched
        if: steps.gate.outputs.run == 'true' && steps.scan.outputs.needs_translation == 'true'
        env:
          DIR: ${{ inputs.translations_dir }}
        run: |
          if ! git diff --exit-code -- "$DIR/studio.en.yaml"; then
            echo "::error::The translate step modified studio.en.yaml — refusing to commit"
            exit 1
          fi

      - name: Re-validate (mechanical gate)
        id: revalidate
        if: steps.gate.outputs.run == 'true' && steps.scan.outputs.needs_translation == 'true'
        shell: bash
        env:
          DIR: ${{ inputs.translations_dir }}
          BASELINE_ERRORS: ${{ steps.scan.outputs.baseline_errors }}
        run: |
          # Runs the copied scripts in .translation-skill/: the private checkout is gone by
          # now (deleted before the model step). No Edit allow rule covers
          # .translation-skill/**, and the model's single Bash rule is an exact command
          # match, so no redirect or extra argument can be smuggled into it.
          #
          # The gate is baseline-relative, not "must exit 0": errors that already existed at
          # the merge base are not this PR's to fix, and demanding zero makes every PR in a
          # drifted repo permanently red. The validator exits 1 whenever ANY error exists, so
          # its exit code cannot be the gate — capture it, and keep exit >= 2 (usage/IO
          # error, i.e. misconfiguration) as a hard failure.
          set +e
          python3 .translation-skill/scripts/validate_translations.py --dir "$DIR" \
            > "$RUNNER_TEMP/revalidation.txt" 2>&1
          REVALIDATE_EXIT=$?
          set -e
          cat "$RUNNER_TEMP/revalidation.txt"
          if [ "$REVALIDATE_EXIT" -ge 2 ]; then
            echo "::error::validate_translations.py failed with a usage/IO error (exit $REVALIDATE_EXIT) after the translate step"
            exit 1
          fi

          FINAL_ERRORS=$(grep -oE '[0-9]+ error\(s\)' "$RUNNER_TEMP/revalidation.txt" | tail -1 | grep -oE '^[0-9]+' || echo 0)
          # Exported so the PR comment can report backlog progress (final vs baseline).
          echo "final_errors=$FINAL_ERRORS" >> "$GITHUB_OUTPUT"
          echo "Validation errors after translating: $FINAL_ERRORS (merge base baseline: $BASELINE_ERRORS)"

          # Two independent gates, in this order. This first one is the count comparison, and
          # it answers exactly one question: did this run leave the repo worse than it found
          # it? It cannot answer "was this PR's delta applied?" — with backlog cleanup active,
          # a legacy error the model fixed offsets an added key it skipped and the two cancel
          # out. That second question is answered directly by delta_check.py below, per key
          # and per language, so the delta guarantee is enforced rather than inferred.
          if [ "$FINAL_ERRORS" -gt "$BASELINE_ERRORS" ]; then
            {
              echo "### ❌ Generated translations failed validation — nothing committed"
              echo ""
              echo "Validation errors (${FINAL_ERRORS}) exceed the merge-base baseline (${BASELINE_ERRORS})."
              echo ""
              echo '```'
              cat "$RUNNER_TEMP/revalidation.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Generated translations failed validation — nothing was committed"
            exit 1
          fi

          if [ "$FINAL_ERRORS" -gt 0 ]; then
            echo "::warning::${FINAL_ERRORS} validation error(s) remain, all pre-existing at the merge base — not introduced by this PR, and not blocking it"
          fi

          # Second gate: the delta itself, asserted per key and per language. Generated in the
          # scan step (see the rationale there); reads DIR and RUNNER_TEMP from this step's
          # environment. Runs after the count comparison has passed, and three steps before
          # anything is committed — "Detect changes", "Comment on PR" and "Configure push
          # credentials" all sit between here and the commit action, and a failure here aborts
          # the job before any of them, so nothing is pushed and no comment is posted.
          set +e
          python3 "$RUNNER_TEMP/delta_check.py" --delta "$RUNNER_TEMP/delta.json" --dir "$DIR" \
            --languages .translation-skill/data/languages.yaml > "$RUNNER_TEMP/delta-violations.txt" 2>&1
          DELTA_EXIT=$?
          set -e
          cat "$RUNNER_TEMP/delta-violations.txt"
          if [ "$DELTA_EXIT" -ne 0 ]; then
            {
              echo "### ❌ This PR's key changes were not applied to every language — nothing committed"
              echo ""
              echo "Total validation errors are within the merge-base baseline, but this PR's own"
              echo "added keys are still missing, or its removed keys are still present, in the"
              echo "language files listed below. Backlog cleanup elsewhere in the same run can hide"
              echo "that in the totals, so the key changes are checked directly."
              echo ""
              echo '```'
              cat "$RUNNER_TEMP/delta-violations.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::the model did not apply this PR's key changes to every language"
            exit 1
          fi

      - name: Detect changes
        id: changes
        if: steps.gate.outputs.run == 'true' && steps.scan.outputs.needs_translation == 'true'
        shell: bash
        env:
          DIR: ${{ inputs.translations_dir }}
          MERGE_BASE: ${{ steps.scan.outputs.merge_base }}
          STALE_OUT: ${{ runner.temp }}/stale-after.json
        run: |
          # --porcelain, not `git diff`: a newly created language file is untracked.
          if [ -n "$(git status --porcelain -- "$DIR/studio.*.yaml")" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

          # Recompute staleness with the same script, now against the model's output. What
          # survives is a changed-in-English key whose existing translation the model kept.
          # Reporting only: the bot-commit circuit breaker makes the follow-up run green
          # either way, so these pairs go into the PR comment for human review instead of
          # failing the job.
          python3 "$RUNNER_TEMP/stale_check.py"
          cat "$STALE_OUT"

      # Comment BEFORE pushing: the bot commit re-enters the caller's per-PR concurrency
      # group with cancel-in-progress, which can cancel this run before a later step runs.
      - name: Comment on PR
        if: steps.gate.outputs.run == 'true' && steps.changes.outputs.any == 'true'
        uses: actions/github-script@v7
        env:
          BASELINE_ERRORS: ${{ steps.scan.outputs.baseline_errors }}
          FINAL_ERRORS: ${{ steps.revalidate.outputs.final_errors }}
        with:
          github-token: ${{ secrets.TRANSLATIONS_GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const marker = '<!-- translations-workflow -->';
            const delta = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/delta.json`, 'utf8'));
            // "Re-translated" must reflect what was actually re-translated: the stale
            // changed-key/language pairs, not every changed key in the delta.
            let stale = {};
            const stalePath = `${process.env.GITHUB_WORKSPACE}/.translation-scan/stale.json`;
            if (fs.existsSync(stalePath)) {
              try {
                stale = JSON.parse(fs.readFileSync(stalePath, 'utf8')) ?? {};
              } catch (err) {
                core.warning(`Could not parse stale.json: ${err.message}`);
              }
            }
            // Recomputed after the model ran: pairs still stale are existing translations
            // the model chose to keep. The circuit breaker makes the follow-up run green
            // regardless, so surface them here rather than letting them pass unmentioned.
            let keptStale = {};
            const staleAfterPath = `${process.env.RUNNER_TEMP}/stale-after.json`;
            if (fs.existsSync(staleAfterPath)) {
              try {
                keptStale = JSON.parse(fs.readFileSync(staleAfterPath, 'utf8')) ?? {};
              } catch (err) {
                core.warning(`Could not parse stale-after.json: ${err.message}`);
              }
            }
            const clean = (k) => String(k).replace(/`/g, '');
            const section = (title, items) => items.length
              ? `**${title} (${items.length}):**\n${items.join('\n')}\n\n`
              : '';
            const keyItems = (keys) => keys.map((k) => `- \`${clean(k)}\``);
            const staleItems = Object.entries(stale)
              .map(([k, langs]) => `- \`${clean(k)}\` (${(langs ?? []).join(', ')})`);
            let body = [
              marker,
              '### 🌐 Translations synced automatically',
              '',
              'The key changes below were generated for all target languages, passed the',
              'mechanical validation gate (key parity, order, placeholders, types, plurals),',
              'and are being committed to this branch by the workflow (check the run status',
              'if the commit is not visible).',
              'Please review the generated translations.',
              '',
              section('Added', keyItems(Object.keys(delta.added ?? {})))
                + section('Re-translated (English value changed)', staleItems)
                + section('Removed', keyItems(delta.removed ?? [])),
            ].join('\n');
            const keptItems = Object.entries(keptStale)
              .map(([k, langs]) => `- \`${clean(k)}\` (${(langs ?? []).join(', ')})`);
            if (keptItems.length) {
              body += `\n#### ♻️ Existing translations kept (verify these)\n\n`
                + `These keys changed in English but kept their existing translations —`
                + ` confirm they still fit the new English wording.\n\n`
                + `${keptItems.join('\n')}\n`;
            }
            // The file is pre-created empty, so existence proves nothing: only non-blank
            // content means the model actually reported ambiguous keys.
            const reportPath = `${process.env.GITHUB_WORKSPACE}/.translation-report.md`;
            const report = fs.existsSync(reportPath)
              ? fs.readFileSync(reportPath, 'utf8').trim()
              : '';
            if (report) {
              body += `\n#### ⚠️ Ambiguous keys (review carefully)\n\n${report}\n`;
            }
            // Errors that already existed at the merge base are reported, never blocking:
            // the job's gate is "no worse than the merge base", so a legacy backlog stays
            // visible to reviewers without turning every PR in the repo red. PR runs do not
            // repair that backlog (the model is told to leave baseline errors alone), but if
            // a run happened to clear some the count is reported. Both counts are parsed
            // defensively — a missing or non-numeric value falls back to the plain "backlog
            // exists" wording.
            const baselineErrors = Number.parseInt(process.env.BASELINE_ERRORS ?? '', 10);
            const finalErrors = Number.parseInt(process.env.FINAL_ERRORS ?? '', 10);
            if (Number.isFinite(baselineErrors) && baselineErrors > 0) {
              if (Number.isFinite(finalErrors) && finalErrors < baselineErrors) {
                body += `\n#### 🧹 Pre-existing translation errors (backlog partly cleared)\n\n`
                  + `${baselineErrors} validation error(s) predating this PR were present at the`
                  + ` merge base. This run also fixed ${baselineErrors - finalErrors} of them;`
                  + ` ${finalErrors} still remain. The remainder is not blocking; clearing it`
                  + ` needs a dedicated PR.\n`;
              } else if (Number.isFinite(finalErrors) && finalErrors === baselineErrors) {
                body += `\n#### ℹ️ Pre-existing translation errors (not from this PR)\n\n`
                  + `${baselineErrors} validation error(s) predating this PR are still present.`
                  + ` They are not blocking it and PR runs do not repair them; clearing them`
                  + ` needs a dedicated PR.\n`;
              } else {
                body += `\n#### ℹ️ Pre-existing translation errors (not from this PR)\n\n`
                  + `${baselineErrors} validation error(s) were already present in these files at`
                  + ` the merge base. They predate this PR and are not blocking it.\n`;
              }
            }
            // Scope the upsert to our own comment: a marker planted by another user must
            // neither be hijacked (we would edit their comment) nor block us (we would
            // never post). Paginate — the marker can sit past the first page on busy PRs.
            let me = null;
            try {
              me = (await github.rest.users.getAuthenticated()).data.login;
            } catch (e) {
              core.warning('Could not resolve token identity: ' + e.message);
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = me
              ? comments.find((c) => c.body && c.body.includes(marker) && c.user?.login === me)
              : null;
            let updated = false;
            if (existing) {
              try {
                await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
                updated = true;
              } catch (e) {
                core.warning('Could not update existing comment, creating a new one: ' + e.message);
              }
            }
            if (!updated) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      - name: Configure push credentials
        if: steps.gate.outputs.run == 'true' && steps.scan.outputs.needs_translation == 'true'
        env:
          TOKEN: ${{ secrets.TRANSLATIONS_GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # claude-code-action's agent mode strips checkout's auth header and rewires
          # origin to its own (read-only) token — restore a push-capable remote here,
          # after the model has run and just before the commit step needs it.
          git config --unset-all "http.https://github.com/.extraheader" 2>/dev/null || true
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"

      # The model step takes minutes; a human push to the PR branch in that window made the
      # bot's push non-fast-forward and threw the whole run away (measured: the three most
      # expensive runs in a fortnight, ~27% of spend, all ended in "! [rejected]"). The
      # caller's cancel-in-progress only stops a run that has not reached this point yet.
      # So: if the branch moved, replay the model's language-file output on top of the new
      # tip with a 3-way apply. A real conflict (a human edited the same language lines) is
      # loud — the job fails, nothing is pushed, and the next human push re-runs the model.
      - name: Rebase model output onto the current branch tip
        if: steps.gate.outputs.run == 'true' && steps.scan.outputs.needs_translation == 'true' && steps.changes.outputs.any == 'true'
        shell: bash
        env:
          DIR: ${{ inputs.translations_dir }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          DIR="${DIR%/}"
          # FETCH_HEAD, not origin/<branch>: the checkout action may not have a remote-tracking
          # refspec configured, so the remote-tracking ref is not guaranteed to be updated.
          git fetch --quiet origin "$HEAD_REF"
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ]; then
            echo "Branch tip unchanged since checkout; nothing to rebase."
            exit 0
          fi
          echo "Branch moved from $(git rev-parse --short HEAD) to $(git rev-parse --short FETCH_HEAD) during the model step; replaying model output."
          # Stage first so a language file the model CREATED is part of the patch too.
          git add -A -- "$DIR"/studio.*.yaml
          git diff --cached --binary -- "$DIR"/studio.*.yaml > "$RUNNER_TEMP/model-output.patch"
          git reset --quiet --hard FETCH_HEAD
          if [ ! -s "$RUNNER_TEMP/model-output.patch" ]; then
            echo "Model output patch is empty after staging; nothing to replay."
            exit 0
          fi
          if ! git apply --3way --index "$RUNNER_TEMP/model-output.patch"; then
            {
              echo "### ❌ Could not replay generated translations onto the updated branch"
              echo ""
              echo "The branch received new commits while the model was running and the generated"
              echo "language-file changes conflict with them. Nothing was pushed. Push again (or"
              echo "re-run this workflow) to regenerate the translations on top of the current tip."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::generated translations conflict with commits pushed during the model step"
            exit 1
          fi
          git reset --quiet -- "$DIR"   # leave the changes unstaged; the commit action stages by file_pattern
          git status --short -- "$DIR"

      - name: Commit generated translations
        if: steps.gate.outputs.run == 'true' && steps.scan.outputs.needs_translation == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Sync translations with studio.en.yaml [automated]"
          file_pattern: "${{ inputs.translations_dir }}/studio.*.yaml"

      - name: Summary — translated
        if: steps.gate.outputs.run == 'true' && steps.scan.outputs.needs_translation == 'true'
        env:
          CHANGES: ${{ steps.changes.outputs.any }}
        run: |
          if [ "$CHANGES" = "true" ]; then
            {
              echo "### 🌐 Missing translations generated and committed"
              echo ""
              echo "A commit syncing the language files was pushed to this branch;"
              echo "CI re-runs on it and must come back green (in sync)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ✅ Nothing to commit"
              echo ""
              echo "The delta required no file changes (translations already correct)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
