name: "CLA Check Workflow"

on:
  workflow_call:
    secrets:
      CLA_ACTION_ACCESS_TOKEN:
        required: true

# Runs the vendored copy of contributor-assistant/github-action from this
# collection, see .github/actions/cla-assistant/README.md for the patch.
# The retry covers transient API errors on the remaining calls.
jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      # The ref this reusable workflow was called with, e.g. refs/heads/main.
      - name: "Resolve collection ref"
        id: collection
        env:
          JOB_WORKFLOW_REF: ${{ github.job_workflow_ref }}
        run: |
          echo "job_workflow_ref=$JOB_WORKFLOW_REF"
          echo "ref=${JOB_WORKFLOW_REF##*@}" >> "$GITHUB_OUTPUT"

      # Public repo, never the PR head, no token needed.
      - name: "Checkout vendored action"
        uses: actions/checkout@v5.0.1
        with:
          repository: pimcore/workflows-collection-public
          ref: ${{ steps.collection.outputs.ref }}
          path: _central
          sparse-checkout: .github/actions/cla-assistant

      - name: "CLA Assistant"
        id: cla
        continue-on-error: true
        uses: ./_central/.github/actions/cla-assistant
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_ACTION_ACCESS_TOKEN }}
        with:
          path-to-signatures: "signatures/version1/cla.json"
          path-to-document: "https://github.com/pimcore/pimcore/blob/master/CLA.md"
          branch: "main"
          allowlist: user1,bot*,Copilot,claude,pimcore-deployments,Pimcore*,pimcore*
          remote-organization-name: "pimcore"
          remote-repository-name: "cla"

      - name: "Wait before retrying"
        if: steps.cla.outcome == 'failure'
        run: sleep 30

      - name: "CLA Assistant (retry)"
        if: steps.cla.outcome == 'failure'
        uses: ./_central/.github/actions/cla-assistant
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_ACTION_ACCESS_TOKEN }}
        with:
          path-to-signatures: "signatures/version1/cla.json"
          path-to-document: "https://github.com/pimcore/pimcore/blob/master/CLA.md"
          branch: "main"
          allowlist: user1,bot*,Copilot,claude,pimcore-deployments,Pimcore*,pimcore*
          remote-organization-name: "pimcore"
          remote-repository-name: "cla"
