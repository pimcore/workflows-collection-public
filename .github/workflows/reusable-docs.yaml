name: "Documentation Workflow (Reusable)"

on:
  workflow_call:
    inputs:
      docs_path:
        description: "Path to the docs folder"
        required: false
        type: string
        default: "doc"
      allowed_repo:
        description: "Only run for this repository (empty = any repo)"
        required: false
        type: string
        default: ""
      checkout_ref:
        description: >
          Explicit commit/branch/SHA to checkout.
          If empty, the workflow will:
          - use PR head SHA for pull_request_target
          - otherwise use github.sha
        required: false
        type: string
        default: ""
      docs_generator_ref:
        description: >
          Ref (branch/tag/SHA) of pimcore/workflows-collection-public providing
          the docs-generator tooling. If empty, the tooling is taken from the
          same commit as this workflow file, so pinning the workflow also pins
          the tooling.
        required: false
        type: string
        default: ""
    secrets:
      # Deprecated and unused: the docs are now built from public vendored tooling,
      # so no token is needed. Kept declared as optional for one migration cycle so
      # existing callers that still pass it at @main don't fail secret validation.
      # Remove once all consumer repos have dropped it.
      DOCS_GENERATOR_ACCESS_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  docs:
    name: "Generate docs Pimcore Docs Generator"
    runs-on: ubuntu-latest
    if: ${{ inputs.allowed_repo == '' || github.repository == inputs.allowed_repo }}
    
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v5.0.1
        with:
          ref: >-
            ${{
              inputs.checkout_ref != '' && inputs.checkout_ref ||
              (github.event_name == 'pull_request_target'
                && github.event.pull_request.head.sha
                || github.sha)
            }}
          # This may be untrusted fork content under pull_request_target, and
          # nothing here runs git afterwards. Don't leave a token on disk.
          persist-credentials: false

      - name: "Checkout Docs Generator"
        uses: actions/checkout@v5.0.1
        with:
          repository: "pimcore/workflows-collection-public"
          # job_workflow_sha is the commit of this reusable workflow file, so
          # the tooling can't drift away from the workflow that calls it.
          ref: ${{ inputs.docs_generator_ref != '' && inputs.docs_generator_ref || github.job_workflow_sha }}
          path: "./_docs_tool"
          sparse-checkout: docs-generator
          persist-credentials: false

      - name: "Install Node"
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: "Prepare Docs"
        working-directory: "./_docs_tool/docs-generator"
        env:
          DOCS_PATH: ${{ inputs.docs_path }}
        run: |
          mkdir docs
          # copy the caller repo's docs (workspace root) into the tooling working dir
          cp -r "../../$DOCS_PATH" ./docs/

          # copy index page
          cp bin/resources/00_index_empty.md ./docs/00_index.md

      - name: "Build Docs"
        working-directory: "./_docs_tool/docs-generator"
        run: |
          npm ci
          npm run build